syntax = "proto3";

package chat;

service ChatGrpcService {
  rpc Health (HealthRequest) returns (HealthResponse);
}

service ChatMessagingGrpcService {
  rpc CreateRoom (CreateRoomRequest) returns (RoomResponse);
  rpc JoinRoom (JoinRoomRequest) returns (RoomResponse);
  rpc ListUserRooms (ListUserRoomsRequest) returns (ListRoomsResponse);
  rpc CreateMessage (CreateMessageRequest) returns (MessageResponse);
  rpc ListRoomMessages (ListRoomMessagesRequest) returns (ListMessagesResponse);
  rpc GetMessageById (GetMessageByIdRequest) returns (MessageResponse);
  rpc UpdateMessage (UpdateMessageRequest) returns (MessageResponse);
  rpc MarkMessageRead (MarkMessageReadRequest) returns (MessageResponse);
  rpc DeleteMessage (DeleteMessageRequest) returns (DeleteMessageResponse);
}

message HealthRequest {}

message HealthResponse {
  string status = 1;
}

message ChatRequestMetadata {
  string trace_id = 1;
  string request_id = 2;
  string parent_request_id = 3;
  string correlation_id = 4;
  string causation_id = 5;
  string request_pattern = 6;
  string request_status = 7;
  string service_name = 8;
  string service_ip = 9;
  string user_id = 10;
  string anonymous_id = 11;
  string session_id = 12;
  string actor_type = 13;
  string request_ip = 14;
}

message CreateRoomData {
  string user_id = 1;
}

message CreateRoomRequest {
  CreateRoomData data = 1;
  ChatRequestMetadata metadata = 2;
}

message JoinRoomData {
  string room_id = 1;
  string user_id = 2;
}

message JoinRoomRequest {
  JoinRoomData data = 1;
  ChatRequestMetadata metadata = 2;
}

message ListUserRoomsData {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
  string q = 4;
  string sort_by = 5;
  string sort_order = 6;
}

message ListUserRoomsRequest {
  ListUserRoomsData data = 1;
  ChatRequestMetadata metadata = 2;
}

message CreateMessageData {
  string room_id = 1;
  string sender_id = 2;
  string content = 3;
}

message CreateMessageRequest {
  CreateMessageData data = 1;
  ChatRequestMetadata metadata = 2;
}

message ListRoomMessagesData {
  string room_id = 1;
  string user_id = 2;
  int32 page = 3;
  int32 limit = 4;
  string before = 5;
  string after = 6;
}

message ListRoomMessagesRequest {
  ListRoomMessagesData data = 1;
  ChatRequestMetadata metadata = 2;
}

message MessageIdData {
  string message_id = 1;
  string user_id = 2;
}

message GetMessageByIdRequest {
  MessageIdData data = 1;
  ChatRequestMetadata metadata = 2;
}

message UpdateMessageData {
  string message_id = 1;
  string user_id = 2;
  string content = 3;
  bool is_read = 4;
  bool has_content = 5;
  bool has_is_read = 6;
}

message UpdateMessageRequest {
  UpdateMessageData data = 1;
  ChatRequestMetadata metadata = 2;
}

message MarkMessageReadRequest {
  MessageIdData data = 1;
  ChatRequestMetadata metadata = 2;
}

message DeleteMessageRequest {
  MessageIdData data = 1;
  ChatRequestMetadata metadata = 2;
}

message RoomResponse {
  string id = 1;
  string user_1_id = 2;
  string user_2_id = 3;
  string last_message_at = 4;
  string created_at = 5;
  string updated_at = 6;
}

message MessageResponse {
  string id = 1;
  string room_id = 2;
  string sender_id = 3;
  string content = 4;
  bool is_read = 5;
  string created_at = 6;
  string updated_at = 7;
}

message ListRoomsResponse {
  repeated RoomResponse rooms = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message ListMessagesResponse {
  repeated MessageResponse messages = 1;
  int32 page = 2;
  int32 limit = 3;
  int32 total = 4;
}

message DeleteMessageResponse {
  bool success = 1;
  string message_id = 2;
}
