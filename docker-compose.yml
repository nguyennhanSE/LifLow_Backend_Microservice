  api-gateway-postgres:
    image: postgres:17-alpine
    container_name: api-gateway-postgres-microservice
    env_file:
      - .env.prod
    environment:
      # IMPORTANT:
      # - `${...}` here is resolved by Docker Compose *before* containers start.
      # - `env_file` does NOT populate those `${...}` values for Compose interpolation.
      #   (it only injects env into the container once it starts).
      # So we provide defaults to prevent Postgres from exiting when variables are missing.
      POSTGRES_USER: ${API_GATEWAY_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${API_GATEWAY_DATABASE_PASSWORD:-123456}
      POSTGRES_DB: ${API_GATEWAY_DATABASE_NAME:-postgres}
    volumes:
      - api_gateway_postgres_data_microservice:/var/lib/postgresql/data
    ports:
      - "${API_GATEWAY_DATABASE_PORT:-5433}:5432"
    networks:
      - liflow-network-microservice
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  identity-postgres:
    image: postgres:17-alpine
    container_name: identity-postgres-microservice
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${IDENTITY_SERVICE_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${IDENTITY_SERVICE_DATABASE_PASSWORD:-123456}
      POSTGRES_DB: ${IDENTITY_SERVICE_DATABASE_NAME:-postgres}
    volumes:
      - identity_postgres_data_microservice:/var/lib/postgresql/data
    ports:
      - "${IDENTITY_SERVICE_DATABASE_PORT:-5434}:5432"
    networks:
      - liflow-network-microservice
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  loyalty-postgres:
    image: postgres:17-alpine
    container_name: loyalty-postgres-microservice
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: ${LOYALTY_SERVICE_DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${LOYALTY_SERVICE_DATABASE_PASSWORD:-123456}
      POSTGRES_DB: ${LOYALTY_SERVICE_DATABASE_NAME:-postgres}
    volumes:
