    ports:
      - "${NOTIFICATION_SERVICE_DATABASE_PORT:-5438}:5432"
    networks:
      - liflow-network-microservice
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      
  
  redis: 
    image: redis:7-alpine
    container_name: redis-microservice
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data_microservice:/data
    networks:
      - liflow-network-microservice
    # Ubuntu/EC2 optimizations
    # sysctls:
    #   - net.core.somaxconn=65535
    # ulimits:
    #   memlock: -1
    # environment:
    #   - REDIS_REPLICATION_MODE=master

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq-microservice
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data_microservice:/var/lib/rabbitmq
    networks:
      - liflow-network-microservice
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter-microservice
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - liflow-network-microservice
    pid: host                          # Xem processes của host
    volumes:
      - /proc:/host/proc:ro            # CPU, RAM, processes
      - /sys:/host/sys:ro              # Hardware info
      - /:/rootfs:ro                   # Filesystem
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-microservice
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - prometheus_data_microservice:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - liflow-network-microservice

  loki:
    image: grafana/loki:3.4.2
    container_name: loki-microservice
    ports:
      - "3100:3100"
    restart: unless-stopped
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml
      - loki_data_microservice:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - liflow-network-microservice
  grafana:
    image: grafana/grafana-oss:latest
    container_name: grafana-microservice
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data_microservice:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    networks:
      - liflow-network-microservice

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: redisinsight-microservice
    ports:
      - "5540:5540" 
    restart: unless-stopped
    volumes:
      - redisinsight_data_microservice:/data
    networks:
      - liflow-network-microservice
      
  backup-api-gateway:
    image: prodrigestivill/postgres-backup-local
    container_name: backup-api-gateway-microservice
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - backup_api_gateway_data_microservice:/backups
    environment:
      - POSTGRES_HOST=api-gateway-postgres
      - POSTGRES_DB=${API_GATEWAY_DATABASE_NAME:-postgres}
      - POSTGRES_USER=${POSTGRES_BACKUP_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_BACKUP_USER_PASSWORD:-123456}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - EXTRA_OPTS=--schema=public
    depends_on:
      api-gateway-postgres:
        condition: service_healthy
    networks:
      - liflow-network-microservice

  backup-identity:
    image: prodrigestivill/postgres-backup-local
    container_name: backup-identity-microservice
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - backup_identity_data_microservice:/backups
    environment:
      - POSTGRES_HOST=identity-postgres
      - POSTGRES_DB=${IDENTITY_SERVICE_DATABASE_NAME:-postgres}
      - POSTGRES_USER=${POSTGRES_BACKUP_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_BACKUP_USER_PASSWORD:-123456}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - EXTRA_OPTS=--schema=public
    depends_on:
      identity-postgres:
        condition: service_healthy
    networks:
      - liflow-network-microservice

  backup-loyalty:
    image: prodrigestivill/postgres-backup-local
    container_name: backup-loyalty-microservice
    env_file:
      - .env.prod
    restart: unless-stopped
    volumes:
      - backup_loyalty_data_microservice:/backups
    environment:
      - POSTGRES_HOST=loyalty-postgres
      - POSTGRES_DB=${LOYALTY_SERVICE_DATABASE_NAME:-postgres}
      - POSTGRES_USER=${POSTGRES_BACKUP_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_BACKUP_USER_PASSWORD:-123456}
      - SCHEDULE=@daily
      - BACKUP_KEEP_DAYS=7
      - EXTRA_OPTS=--schema=public
    depends_on:
      loyalty-postgres:
        condition: service_healthy
    networks:
      - liflow-network-microservice
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: elasticsearch-microservice
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data_microservice:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - liflow-network-microservice
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.0
    container_name: kibana-microservice
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - kibana_data_microservice:/usr/share/kibana/data
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - liflow-network-microservice
    
